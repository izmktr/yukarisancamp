server {
    listen 80;
    server_name yukarisan.mydns.jp;

    # Let's Encrypt の認証チャレンジ用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # それ以外は HTTPS へリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443番の server ブロックは含めていない。
# `certbot --nginx -d yukarisan.mydns.jp` を実行すると、証明書取得と同時に
# 443番ブロックがこのファイルに自動追記される（先に443を書くと証明書未取得時に nginx -t が失敗する）。
